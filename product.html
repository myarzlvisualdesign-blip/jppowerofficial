<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Catalog | JP-POWER Official</title>
<meta name="description" content="Katalog lengkap raket, sepatu, apparel, bag, string, dan grip JP-POWER." />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon.png" /><link rel="shortcut icon" type="image/png" href="assets/icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=16" />
</head>
<body>

<div id="siteHeader"></div>

<section class="page-hero">
  <div class="container page-hero-content">
    <div class="breadcrumb"><a href="index.html">HOME</a> <span>/</span> <span>PRODUCT</span></div>
    <span class="page-hero-eyebrow">FULL CATALOG</span>
    <h1>SEMUA PRODUK</h1>
    <p>Eksplor seluruh koleksi JP-POWER — dari raket carbon woven, sepatu hybrid, sampai grip handuk premium. Semua dengan Japan Technology.</p>
  </div>
</section>

<section style="padding: 40px 0 80px;" data-product-filter>
  <div class="container">
    <div class="filter-bar reveal">
      <div class="filter-chips">
        <button class="filter-chip active" data-filter="all">SEMUA</button>
        <button class="filter-chip" data-filter="raket">RAKET BADMINTON</button>
        <button class="filter-chip" data-filter="shoes">SHOES BADMINTON</button>
        <button class="filter-chip" data-filter="apparel">APPAREL</button>
        <button class="filter-chip" data-filter="short">SHORT</button>
        <button class="filter-chip" data-filter="string">STRING &amp; GRIP</button>
        <button class="filter-chip" data-filter="bag">BAG</button>
        <button class="filter-chip" data-filter="court">COURT ACCESSORIES</button>
        <button class="filter-chip" data-filter="stringing">STRINGING MACHINE</button>
      </div>
      <div class="filter-sort">
        <span>SORT:</span>
        <select data-sort>
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="newest">Newest</option>
          <option value="best">Best Selling</option>
        </select>
      </div>
    </div>

    <div class="yx-grid" data-render-grid="all"></div>
  </div>
</section>

<section class="newsletter">
  <div class="container">
    <div class="news-inner">
      <div class="news-text"><h2>Dapat Notifikasi <span>Produk Baru</span></h2><p>Subscribe untuk update koleksi terbaru, promo, dan early access.</p></div>
      <form class="news-form"><input type="email" placeholder="Email kamu..." required /><button type="submit">SUBSCRIBE</button></form>
    </div>
  </div>
</section>

<div id="siteFooter"></div>

<script src="js/data.js?v=16"></script>
<script src="js/cart.js?v=16"></script>
<script src="js/ui.js?v=16"></script>
<script src="js/partials.js?v=16"></script>
<script src="js/render.js?v=16"></script>
<script src="js/main.js?v=16"></script>
</body>
</html>
