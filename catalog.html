<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Katalog JP-POWER 2026 | Japan Technology Badminton</title>
<meta name="description" content="Katalog digital lengkap JP-POWER Juni 2026 — grommet, senar, grip, tas, apparel, sepatu, support, dan alat stringing." />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon.png" />
<link rel="shortcut icon" type="image/png" href="assets/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=17" />
<style>
* { box-sizing: border-box; }
body { background: #ececef; margin: 0; }

/* ---- Slim top bar ---- */
.cat-hero { background: #0d0f11; padding: 26px 0 18px; text-align: center; }
.cat-hero .eb { font-family:'Barlow Condensed',sans-serif; letter-spacing:.26em; font-size:11px; color:rgba(255,255,255,.32); margin-bottom:3px; }
.cat-hero h1 { font-family:'Anton',sans-serif; font-size:clamp(24px,3.4vw,42px); color:#fff; letter-spacing:.06em; margin:0 0 4px; }
.cat-hero p { color:rgba(255,255,255,.4); font-size:12px; margin:0 0 16px; }
.cat-tabs { display:flex; justify-content:center; gap:7px; flex-wrap:wrap; padding:0 16px; }
.cat-tab {
  padding:6px 16px; border-radius:100px; font-family:'Barlow Condensed',sans-serif;
  font-weight:700; letter-spacing:.1em; font-size:12px; cursor:pointer;
  border:1.5px solid rgba(255,255,255,.16); color:rgba(255,255,255,.55);
  background:transparent; transition:all .2s;
}
.cat-tab.active, .cat-tab:hover { background:#00B140; color:#fff; border-color:#00B140; }

/* ---- Viewer (light, flbook style) ---- */
.viewer-fs { background:#ececef; }
.viewer {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 70px 16px;
  /* fit comfortably in viewport: 100vh - (header ~120) - (toolbar ~64) - paddings */
  min-height: min(72vh, 720px);
}
.book-stage {
  perspective:2600px;
  width:100%;
  /* cap by both width AND height so book never overflows viewport */
  max-width: min(1060px, calc((100vh - 230px) * 1.413));
  overflow:visible;          /* let the 3D flip render fully without clipping */
  display:flex;
  justify-content:center;
}
.book-stage.zoomed { overflow:auto; cursor:grab; max-height:80vh; width:100%; }
.book-stage.zoomed::-webkit-scrollbar { width:8px; height:8px; }
.book-stage.zoomed::-webkit-scrollbar-thumb { background:rgba(0,0,0,.25); border-radius:4px; }
.book {
  position:relative; display:flex; width:100%; aspect-ratio: 1654 / 1170;
  max-height: calc(100vh - 230px);   /* never taller than viewport - chrome */
  border-radius:2px 6px 6px 2px;
  box-shadow:0 18px 50px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.05);
  transform-style:preserve-3d; background:#fff;
  transition: width .32s ease;
  cursor: grab;              /* invite drag-to-flip */
  user-select: none;
  touch-action: pan-y pinch-zoom;
}
.book.dragging { cursor: grabbing; }
.book.no-anim { transition: none; }
.book.no-anim .leaf { transition: none !important; }
.half { flex:1; position:relative; overflow:hidden; background:#fff; }
.half.left  { border-radius:2px 0 0 2px; box-shadow: inset -12px 0 24px -14px rgba(0,0,0,.22); }
.half.right { border-radius:0 6px 6px 0; box-shadow: inset 12px 0 24px -14px rgba(0,0,0,.22); }
.half img { width:100%; height:100%; object-fit:cover; display:block; }
.book-spine { position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%); background:rgba(0,0,0,.18); z-index:6; }

/* ---- Turning leaf (single rotating page, CSS transition for reliability) ---- */
.leaf {
  position:absolute; top:0; width:50%; height:100%; z-index:30;
  transform-style:preserve-3d;
  display:none; pointer-events:none;
  will-change:transform, filter;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.06));
  transition: transform .7s cubic-bezier(.5, 0, .5, 1), filter .35s ease;
}
.leaf.no-trans { transition: none; }
.leaf.show-right { display:block; right:0; transform-origin:left center; }
.leaf.show-left  { display:block; left:0;  transform-origin:right center; }
.leaf.flipping { filter: drop-shadow(0 14px 22px rgba(0,0,0,.28)) drop-shadow(0 6px 10px rgba(0,0,0,.14)); }

.leaf-face {
  position:absolute; inset:0;
  backface-visibility:hidden;
  overflow:hidden;
  background:#fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.04);
}
.leaf-face img { width:100%; height:100%; object-fit:cover; display:block; }
.leaf-back { transform:rotateY(180deg); }

/* Paper-curl shading on the FRONT face — simulates light catching the bending paper */
.leaf-shade {
  position:absolute; inset:0; pointer-events:none;
  opacity:0; transition:opacity .25s;
  background: linear-gradient(to right,
    rgba(0,0,0,0.30) 0%,
    rgba(0,0,0,0.10) 8%,
    rgba(0,0,0,0.00) 24%,
    rgba(255,255,255,0.10) 50%,
    rgba(0,0,0,0.00) 76%,
    rgba(0,0,0,0.10) 92%,
    rgba(0,0,0,0.22) 100%);
}
.leaf.show-left .leaf-shade {
  background: linear-gradient(to left,
    rgba(0,0,0,0.30) 0%,
    rgba(0,0,0,0.10) 8%,
    rgba(0,0,0,0.00) 24%,
    rgba(255,255,255,0.10) 50%,
    rgba(0,0,0,0.00) 76%,
    rgba(0,0,0,0.10) 92%,
    rgba(0,0,0,0.22) 100%);
}
.leaf.flipping .leaf-shade { opacity:1; }

/* Paper-curl shading on the BACK face — visible after rotating past 90° */
.leaf-back::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:3;
  background: linear-gradient(to right,
    rgba(0,0,0,0.20) 0%,
    rgba(0,0,0,0.05) 14%,
    rgba(255,255,255,0.08) 50%,
    rgba(0,0,0,0.05) 86%,
    rgba(0,0,0,0.18) 100%);
  opacity:0; transition:opacity .25s;
}
.leaf.show-left .leaf-back::after {
  background: linear-gradient(to left,
    rgba(0,0,0,0.20) 0%,
    rgba(0,0,0,0.05) 14%,
    rgba(255,255,255,0.08) 50%,
    rgba(0,0,0,0.05) 86%,
    rgba(0,0,0,0.18) 100%);
}
.leaf.flipping .leaf-back::after { opacity:1; }

/* ---- Big side arrows ---- */
.side-arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  width:48px; height:64px; border:none; cursor:pointer;
  background:rgba(120,120,128,.45); color:#fff;
  border-radius:8px; font-size:30px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s, opacity .2s; z-index:20;
}
.side-arrow:hover:not(:disabled){ background:rgba(0,177,64,.85); }
.side-arrow:disabled{ opacity:.2; cursor:default; }
.side-prev{ left:14px; }
.side-next{ right:14px; }

/* ---- Bottom toolbar ---- */
.viewer-bar {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; background:#fff; border-top:1px solid #e2e2e6;
  padding:8px 18px; box-shadow:0 -4px 16px rgba(0,0,0,.05);
}
.vb-group { display:flex; align-items:center; gap:4px; }
.vb-btn {
  width:38px; height:38px; border:none; background:transparent; cursor:pointer;
  border-radius:8px; color:#444; display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.vb-btn:hover:not(:disabled){ background:#f0f0f2; color:#00B140; }
.vb-btn:disabled{ opacity:.3; cursor:default; }
.vb-btn svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.vb-num {
  font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.06em;
  font-size:14px; color:#333; padding:0 12px; min-width:96px; text-align:center;
  white-space:nowrap;
}
.vb-divider { width:1px; height:24px; background:#e2e2e6; margin:0 6px; }

/* ---- Thumbnails drawer ---- */
.thumbs {
  display:flex; gap:6px; background:#f6f6f8; border-top:1px solid #e2e2e6;
  overflow-x:auto; padding:10px 14px; max-height:0; transition:max-height .3s, padding .3s;
  overflow-y:hidden; padding-top:0; padding-bottom:0;
}
.thumbs.open { max-height:110px; padding-top:10px; padding-bottom:12px; }
.thumbs::-webkit-scrollbar { height:7px; }
.thumbs::-webkit-scrollbar-thumb { background:rgba(0,0,0,.2); border-radius:4px; }
.thumb { flex-shrink:0; width:54px; height:76px; border-radius:3px; overflow:hidden; cursor:pointer; border:2px solid transparent; opacity:.6; transition:all .18s; background:#ddd; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb.active { border-color:#00B140; opacity:1; }
.thumb:hover { opacity:1; }

/* ---- Fullscreen ---- */
.viewer-fs:fullscreen { display:flex; flex-direction:column; justify-content:center; }
.viewer-fs:fullscreen .viewer { flex:1; min-height:0; }
.viewer-fs:fullscreen .book-stage { max-width:none; height:88%; width:auto; }
.viewer-fs:fullscreen .book { width:auto; height:100%; }

/* ---- Mobile: single page + pinch zoom ---- */
@media (max-width:760px) {
  .viewer { padding:10px 46px 8px; min-height:0; }
  .book-stage { max-width: min(92vw, calc((100vh - 250px) * 0.707)); }
  .book {
    aspect-ratio: 827 / 1170;
    max-height: calc(100vh - 250px);  /* fit header + toolbar + hint + safe area */
  }
  .half.left { display:none; }
  .half.right { border-radius:6px; box-shadow:none; }
  .book-spine { display:none; }
  .leaf { width:100%; }
  .side-arrow { width:36px; height:48px; font-size:24px; opacity:.9; }
  .side-prev{ left:4px; } .side-next{ right:4px; }
  .vb-zoom-only-desktop { display:none; }
  .vb-num { min-width:70px; font-size:13px; }
  .viewer-bar { padding:6px 10px; }
  .vb-btn { width:34px; height:34px; }
  .cat-hero { padding:18px 0 12px; }
  .cat-hero h1 { font-size:22px; }
  .cat-hero p { display:none; }
}
@media (max-width:420px) {
  .viewer { padding:10px 36px 8px; }
  .side-arrow { width:30px; height:42px; font-size:20px; }
  .side-prev{ left:2px; } .side-next{ right:2px; }
}
.hint { text-align:center; color:#999; font-family:'Barlow Condensed',sans-serif; letter-spacing:.08em; font-size:11px; padding:10px; }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="cat-hero">
  <div class="container">
    <div class="eb">JP-POWER OFFICIAL</div>
    <h1>KATALOG 2026</h1>
    <p>Aksesoris JP-POWER Lengkap — Edisi Juni 2026</p>
    <div class="cat-tabs" id="catTabs"></div>
  </div>
</div>

<div class="viewer-fs" id="viewerFs">
  <div class="viewer">
    <button class="side-arrow side-prev" id="sidePrev" aria-label="Sebelumnya">&#8249;</button>
    <div class="book-stage" id="stage">
      <div class="book" id="book">
        <div class="half left"><img id="imgL" alt="Halaman kiri" /></div>
        <div class="half right"><img id="imgR" alt="Halaman kanan" /></div>
        <div class="book-spine"></div>
        <div class="leaf" id="leaf">
          <div class="leaf-face leaf-front"><img id="leafFront" alt="" /><div class="leaf-shade" id="leafShade"></div></div>
          <div class="leaf-face leaf-back"><img id="leafBack" alt="" /></div>
        </div>
      </div>
    </div>
    <button class="side-arrow side-next" id="sideNext" aria-label="Berikutnya">&#8250;</button>
  </div>

  <!-- Bottom toolbar -->
  <div class="viewer-bar">
    <div class="vb-group">
      <button class="vb-btn" id="vbThumbs" title="Thumbnail / Daftar Halaman">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
    </div>

    <div class="vb-group">
      <button class="vb-btn" id="vbFirst" title="Halaman pertama">
        <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
      <button class="vb-btn" id="vbPrev" title="Sebelumnya">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="vb-num" id="vbNum">1 / 54</span>
      <button class="vb-btn" id="vbNext" title="Berikutnya">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="vb-btn" id="vbLast" title="Halaman terakhir">
        <svg viewBox="0 0 24 24"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
      </button>
    </div>

    <div class="vb-group">
      <button class="vb-btn vb-zoom-only-desktop" id="vbZoom" title="Perbesar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <div class="vb-divider vb-zoom-only-desktop"></div>
      <button class="vb-btn" id="vbFull" title="Layar penuh">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>

  <!-- Thumbnail drawer -->
  <div class="thumbs" id="thumbs"></div>
</div>

<div class="hint">Desktop: klik panah samping / tombol zoom / layar penuh &nbsp;·&nbsp; HP: swipe ganti halaman, cubit (pinch) atau ketuk-dua-kali untuk zoom</div>

<div id="siteFooter"></div>

<script src="js/data.js?v=17"></script>
<script src="js/cart.js?v=17"></script>
<script src="js/ui.js?v=17"></script>
<script src="js/partials.js?v=17"></script>
<script src="js/render.js?v=17"></script>
<script src="js/main.js?v=17"></script>
<script>
(() => {
  const TOTAL = 54;
  const pad = n => String(n).padStart(2, '0');
  const pages = [];
  for (let i = 1; i <= TOTAL; i++) pages.push(`assets/catalog/page-${pad(i)}.jpg`);
  const maxSpread = Math.floor((TOTAL - 1) / 2);

  const tabs = [
    { label:'SEMUA', page:1 }, { label:'GROMMET', page:1 }, { label:'SENAR', page:12 },
    { label:'GRIP', page:19 }, { label:'TAS', page:23 }, { label:'APPAREL', page:28 },
    { label:'SHORT', page:36 }, { label:'SUPPORT', page:41 }, { label:'SEPATU', page:45 },
    { label:'BOLA', page:46 }, { label:'ALAT', page:48 }, { label:'MESIN', page:53 },
  ];

  const $ = id => document.getElementById(id);
  const book=$('book'), stage=$('stage'), imgL=$('imgL'), imgR=$('imgR');
  const leaf=$('leaf'), leafFront=$('leafFront'), leafBack=$('leafBack'), leafShade=$('leafShade');
  const vbNum=$('vbNum'), thumbsEl=$('thumbs'), tabsEl=$('catTabs');
  const sidePrev=$('sidePrev'), sideNext=$('sideNext');

  // ---- Leaf helpers (CSS-transition driven for reliability) ----
  function setLeafPages(frontUrl, backUrl){
    leafFront.src = frontUrl || '';
    leafBack.src  = backUrl  || '';
  }
  function resetLeaf(){
    leaf.className = 'leaf';
    leaf.style.transform = '';
    leafFront.src = '';
    leafBack.src  = '';
  }

  const isMobile = () => window.matchMedia('(max-width:760px)').matches;

  // cur = 0-based PAGE index. Desktop keeps it even (spread-aligned).
  let cur = 0, busy = false;

  function preload(p){
    [p-2,p-1,p+1,p+2].forEach(i=>{ if(i>=0&&i<TOTAL){const im=new Image();im.src=pages[i];} });
  }

  function render(){
    const mobile = isMobile();
    if(mobile){
      imgR.src = pages[cur];
      imgR.parentElement.style.visibility='visible';
      imgL.parentElement.style.visibility='hidden';
      vbNum.textContent = `${cur+1} / ${TOTAL}`;
    } else {
      const k=Math.floor(cur/2), l=2*k, r=2*k+1;
      imgL.src = pages[l];
      imgR.src = r<TOTAL?pages[r]:'';
      imgL.parentElement.style.visibility='visible';
      imgR.parentElement.style.visibility = r<TOTAL?'visible':'hidden';
      vbNum.textContent = r<TOTAL?`${l+1}–${r+1} / ${TOTAL}`:`${l+1} / ${TOTAL}`;
    }
    const atStart = cur<=0;
    const atEnd = mobile ? cur>=TOTAL-1 : Math.floor(cur/2)>=maxSpread;
    [sidePrev,$('vbPrev'),$('vbFirst')].forEach(b=>b.disabled=atStart);
    [sideNext,$('vbNext'),$('vbLast')].forEach(b=>b.disabled=atEnd);
    const k=Math.floor(cur/2);
    thumbsEl.querySelectorAll('.thumb').forEach((t,i)=>{
      const on = mobile ? i===cur : (i===2*k||i===2*k+1);
      t.classList.toggle('active', on);
    });
    const at=thumbsEl.querySelector('.thumb.active'); if(at) at.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    preload(cur);
    resetZoom();
  }

  // ---- 3D page flip with REAL paper-bend (5 strips, per-strip easing) ----
  function flip(dir, target){
    if(busy) return; busy=true;
    const mobile = isMobile();
    const k = Math.floor(cur/2), nk = Math.floor(target/2);

    // 1. Figure out which pages map to leaf-front, leaf-back, and what stays underneath.
    let frontUrl = null, backUrl = null;
    if(dir === 'next'){
      if(mobile){ frontUrl = pages[cur]; backUrl = pages[target]; }
      else {
        const r = 2*k+1, tl = 2*nk;
        frontUrl = r < TOTAL ? pages[r] : null;
        backUrl  = pages[tl];
      }
    } else {
      if(mobile){ frontUrl = pages[cur]; backUrl = pages[target]; }
      else {
        const l = 2*k, tl = 2*nk;
        frontUrl = pages[l];
        backUrl  = pages[tl];
      }
    }

    // 2. Set leaf images BEFORE making the leaf visible (no flicker).
    setLeafPages(frontUrl, backUrl);

    // 3. Update the underlying half images (will be revealed behind the leaf as it flips).
    if(dir === 'next'){
      if(mobile){ imgR.src = pages[target]; imgR.parentElement.style.visibility = 'visible'; }
      else {
        const tr = 2*nk+1;
        imgR.src = tr < TOTAL ? pages[tr] : '';
        imgR.parentElement.style.visibility = tr < TOTAL ? 'visible' : 'hidden';
      }
    } else {
      if(mobile){ imgR.src = pages[target]; imgR.parentElement.style.visibility = 'visible'; }
      else {
        const tl = 2*nk;
        imgL.src = pages[tl]; imgL.parentElement.style.visibility = 'visible';
      }
    }

    // 4. Show the leaf at angle 0 with transition disabled (snap to start position).
    leaf.className = 'leaf no-trans ' + (dir === 'next' ? 'show-right' : 'show-left');
    leaf.style.transform = 'rotateY(0deg)';

    // 5. Force reflow, then enable transition + trigger end-state — CSS handles the smooth flip.
    void leaf.offsetWidth;
    requestAnimationFrame(() => {
      leaf.classList.remove('no-trans');
      leaf.classList.add('flipping');
      leaf.style.transform = `rotateY(${dir === 'next' ? -180 : 180}deg)`;
    });

    // 6. After transition ends, commit page change.
    setTimeout(() => {
      cur = target; render();
      resetLeaf();
      busy = false;
    }, 720);
  }

  function step(dir){
    if(busy) return;
    const mobile=isMobile();
    let target;
    if(mobile){
      target = dir==='next'?cur+1:cur-1;
      if(target<0||target>=TOTAL) return;
    } else {
      const k=Math.floor(cur/2), nk= dir==='next'?k+1:k-1;
      if(nk<0||nk>maxSpread) return;
      target = nk*2;
    }
    flip(dir, target);
  }

  function goTo(p){
    if(busy||p<0||p>=TOTAL) return;
    const mobile=isMobile();
    if(mobile){
      if(p===cur) return;
      if(Math.abs(p-cur)===1) flip(p>cur?'next':'prev', p);
      else { cur=p; render(); }
    } else {
      const k=Math.floor(cur/2), nk=Math.floor(p/2);
      if(nk===k) return;
      if(Math.abs(nk-k)===1) flip(nk>k?'next':'prev', nk*2);
      else { cur=nk*2; render(); }
    }
  }

  // thumbnails (one per page)
  pages.forEach((p,i)=>{
    const t=document.createElement('button'); t.className='thumb';
    const im=document.createElement('img'); im.loading='lazy'; im.src=p; t.appendChild(im);
    t.addEventListener('click',()=>goTo(i));
    thumbsEl.appendChild(t);
  });

  // category tabs
  tabs.forEach((tb,i)=>{
    const b=document.createElement('button'); b.className='cat-tab'+(i===0?' active':''); b.textContent=tb.label;
    b.addEventListener('click',()=>{ tabsEl.querySelectorAll('.cat-tab').forEach(x=>x.classList.remove('active')); b.classList.add('active'); goTo(tb.page-1); });
    tabsEl.appendChild(b);
  });

  // controls
  $('vbPrev').onclick=()=>step('prev'); $('vbNext').onclick=()=>step('next');
  sidePrev.onclick=()=>step('prev'); sideNext.onclick=()=>step('next');
  $('vbFirst').onclick=()=>goTo(0); $('vbLast').onclick=()=>goTo(TOTAL-1);
  $('vbThumbs').onclick=()=>thumbsEl.classList.toggle('open');
  document.addEventListener('keydown', e=>{ if(e.key==='ArrowRight')step('next'); if(e.key==='ArrowLeft')step('prev'); });

  // ---- Drag-to-flip (desktop mouse) with grab/grabbing cursor + paper bend ----
  let mdx0 = 0, mdragging = false, mDir = null, peekTarget = null;
  function dragStart(e){
    if(e.pointerType === 'touch') return;
    if(busy || zoomed) return;
    if(e.button !== 0) return;
    if(e.target.closest('.side-arrow, .viewer-bar, .thumbs, .vb-btn')) return;
    mdx0 = e.clientX; mdragging = true; mDir = null; peekTarget = null;
    book.classList.add('dragging');
    book.setPointerCapture && book.setPointerCapture(e.pointerId);
  }
  function dragMove(e){
    if(!mdragging) return;
    const dx = e.clientX - mdx0;
    const dir = dx < 0 ? 'next' : 'prev';
    if(Math.abs(dx) < 6) return;

    if(mDir !== dir){
      mDir = dir;
      const mobile = isMobile();
      const k = Math.floor(cur/2);
      const atEnd   = mobile ? cur>=TOTAL-1 : k>=maxSpread;
      const atStart = cur<=0;
      if((dir==='next' && atEnd) || (dir==='prev' && atStart)){ peekTarget=null; return; }
      let frontUrl=null, backUrl=null;
      if(dir==='next'){
        if(mobile){ frontUrl=pages[cur]; backUrl=pages[cur+1]; peekTarget=cur+1; }
        else{ const r=2*k+1, tl=2*(k+1); frontUrl=r<TOTAL?pages[r]:null; backUrl=pages[tl]; peekTarget=(k+1)*2; }
      } else {
        if(mobile){ frontUrl=pages[cur]; backUrl=pages[cur-1]; peekTarget=cur-1; }
        else{ const l=2*k, tl=2*(k-1); frontUrl=pages[l]; backUrl=pages[tl]; peekTarget=(k-1)*2; }
      }
      // Set images + show leaf at angle 0 (no transition during drag — direct control)
      setLeafPages(frontUrl, backUrl);
      leaf.className = 'leaf no-trans flipping ' + (dir==='next' ? 'show-right' : 'show-left');
      leaf.style.transform = 'rotateY(0deg)';
    }
    if(peekTarget==null) return;
    const bookW = book.clientWidth || 800;
    const ratio = Math.max(0, Math.min(1, Math.abs(dx) / (bookW * 0.45)));
    const sign = mDir === 'next' ? -1 : 1;
    leaf.style.transform = `rotateY(${sign * 180 * ratio}deg)`;
  }
  function dragEnd(e){
    if(!mdragging) return;
    mdragging = false;
    book.classList.remove('dragging');
    book.releasePointerCapture && book.releasePointerCapture(e.pointerId);
    if(peekTarget==null || mDir==null){ resetLeaf(); return; }
    const dx = e.clientX - mdx0;
    const threshold = (book.clientWidth || 800) * 0.18;
    // Enable transition so leaf smoothly animates to commit or snap-back
    leaf.classList.remove('no-trans');
    if(Math.abs(dx) >= threshold){
      busy = true;
      const finalDeg = mDir === 'next' ? -180 : 180;
      requestAnimationFrame(() => { leaf.style.transform = `rotateY(${finalDeg}deg)`; });
      setTimeout(() => { cur = peekTarget; render(); resetLeaf(); busy = false; }, 500);
    } else {
      requestAnimationFrame(() => { leaf.style.transform = 'rotateY(0deg)'; });
      setTimeout(resetLeaf, 450);
    }
  }
  book.addEventListener('pointerdown', dragStart);
  window.addEventListener('pointermove', dragMove);
  window.addEventListener('pointerup', dragEnd);
  window.addEventListener('pointercancel', dragEnd);

  // ---- Desktop zoom (width-based + drag pan) ----
  let zoomed=false;
  function resetZoom(){ zoomed=false; book.style.width='100%'; stage.classList.remove('zoomed'); }
  $('vbZoom').onclick=()=>{
    if(isMobile()) return;
    zoomed=!zoomed; book.style.width=zoomed?'155%':'100%'; stage.classList.toggle('zoomed',zoomed);
    if(zoomed) stage.scrollLeft=(stage.scrollWidth-stage.clientWidth)/2;
  };
  let drag=false,dsx=0,dsy=0,dsl=0,dst=0;
  stage.addEventListener('pointerdown',e=>{ if(!zoomed)return; drag=true; dsx=e.clientX;dsy=e.clientY;dsl=stage.scrollLeft;dst=stage.scrollTop; stage.style.cursor='grabbing'; });
  window.addEventListener('pointermove',e=>{ if(!drag)return; stage.scrollLeft=dsl-(e.clientX-dsx); stage.scrollTop=dst-(e.clientY-dsy); });
  window.addEventListener('pointerup',()=>{ if(!drag)return; drag=false; stage.style.cursor='grab'; });

  // ---- Fullscreen ----
  const fsEl=$('viewerFs');
  $('vbFull').onclick=()=>{ if(!document.fullscreenElement){ (fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl);} else document.exitFullscreen(); };

  // ---- Mobile pinch / double-tap zoom + swipe-to-flip ----
  const zimg=imgR;
  let ms=1,mx=0,my=0,sd=0,ss=1,psx=0,psy=0,bx=0,by=0,swSX=0,swSY=0,lastTap=0,moved=false,pinching=false;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const applyM=()=>{ zimg.style.transform=`translate(${mx}px,${my}px) scale(${ms})`; zimg.style.transition='transform .08s ease-out'; };
  const resetM=()=>{ ms=1;mx=0;my=0; zimg.style.transform=''; };
  book.addEventListener('touchstart',e=>{
    moved=false;
    if(e.touches.length===2){ pinching=true; sd=dist(e.touches); ss=ms; }
    else if(e.touches.length===1){
      pinching=false; swSX=e.touches[0].clientX; swSY=e.touches[0].clientY;
      const now=Date.now();
      if(now-lastTap<300){ ms=ms>1?1:2.6; mx=0;my=0; applyM(); moved=true; }
      lastTap=now;
      if(ms>1){ psx=e.touches[0].clientX;psy=e.touches[0].clientY;bx=mx;by=my; }
    }
  },{passive:true});
  book.addEventListener('touchmove',e=>{
    moved=true;
    if(e.touches.length===2){ ms=clamp(ss*(dist(e.touches)/sd),1,4); if(ms===1){mx=0;my=0;} applyM(); }
    else if(e.touches.length===1 && ms>1){
      const lim=(ms-1), mxX=lim*zimg.clientWidth/2, mxY=lim*zimg.clientHeight/2;
      mx=clamp(bx+(e.touches[0].clientX-psx),-mxX,mxX); my=clamp(by+(e.touches[0].clientY-psy),-mxY,mxY); applyM();
    }
  },{passive:true});
  book.addEventListener('touchend',e=>{
    if(pinching){ if(e.touches.length===0)pinching=false; return; }
    if(ms>1) return; if(e.touches.length>0) return;
    const dx=e.changedTouches[0].clientX-swSX, dy=e.changedTouches[0].clientY-swSY;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy) && moved) step(dx<0?'next':'prev');
  },{passive:true});

  const _r=render; render=function(){ resetM(); _r(); };

  // re-render on breakpoint change
  let wasMobile=isMobile();
  window.addEventListener('resize',()=>{ const m=isMobile(); if(m!==wasMobile){ wasMobile=m; resetZoom(); render(); } });

  render();
})();
</script>
</body>
</html>
