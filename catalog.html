<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Katalog JP-POWER 2026 | Japan Technology Badminton</title>
<meta name="description" content="Katalog digital lengkap JP-POWER Juni 2026 — grommet, senar, grip, tas, apparel, sepatu, support, dan alat stringing." />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon.png" />
<link rel="shortcut icon" type="image/png" href="assets/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=10" />
<style>
* { box-sizing: border-box; }
body { background: #15171a; margin: 0; }

/* ---- Hero bar ---- */
.cat-hero { background: #0d0f11; padding: 34px 0 22px; text-align: center; }
.cat-hero .eb { font-family:'Barlow Condensed',sans-serif; letter-spacing:.26em; font-size:11px; color:rgba(255,255,255,.32); margin-bottom:3px; }
.cat-hero h1 { font-family:'Anton',sans-serif; font-size:clamp(28px,4vw,50px); color:#fff; letter-spacing:.06em; margin:0 0 4px; }
.cat-hero p { color:rgba(255,255,255,.4); font-size:13px; margin:0 0 18px; }
.cat-tabs { display:flex; justify-content:center; gap:7px; flex-wrap:wrap; padding:0 16px; }
.cat-tab {
  padding:6px 16px; border-radius:100px; font-family:'Barlow Condensed',sans-serif;
  font-weight:700; letter-spacing:.1em; font-size:12px; cursor:pointer;
  border:1.5px solid rgba(255,255,255,.16); color:rgba(255,255,255,.55);
  background:transparent; transition:all .2s;
}
.cat-tab.active, .cat-tab:hover { background:#00B140; color:#fff; border-color:#00B140; }

/* ---- Flipbook layout ---- */
.flip-wrap { display:flex; flex-direction:column; align-items:center; padding:30px 14px 50px; }
.book-stage { perspective:2600px; width:100%; max-width:1040px; }
.book {
  position:relative; display:flex; width:100%; aspect-ratio: 1654 / 1170;
  border-radius:2px 8px 8px 2px;
  box-shadow:0 30px 90px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.04);
  transform-style:preserve-3d; background:#222;
}
.half { flex:1; position:relative; overflow:hidden; background:#fff; }
.half.left  { border-radius:2px 0 0 2px; box-shadow: inset -14px 0 28px -14px rgba(0,0,0,.35); }
.half.right { border-radius:0 8px 8px 0; box-shadow: inset 14px 0 28px -14px rgba(0,0,0,.35); }
.half img { width:100%; height:100%; object-fit:cover; display:block; }
.book-spine { position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%); background:rgba(0,0,0,.28); z-index:6; }

/* ---- Turning leaf ---- */
.leaf {
  position:absolute; top:0; width:50%; height:100%; z-index:30;
  transform-style:preserve-3d; transition:transform .62s cubic-bezier(.42,0,.35,1);
  display:none; will-change:transform;
}
.leaf.show-right { display:block; right:0; transform-origin:left center; }
.leaf.show-left  { display:block; left:0;  transform-origin:right center; }
.leaf-face { position:absolute; inset:0; backface-visibility:hidden; overflow:hidden; background:#fff; }
.leaf-face img { width:100%; height:100%; object-fit:cover; display:block; }
.leaf-back { transform:rotateY(180deg); }
.leaf-shade { position:absolute; inset:0; background:linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.22)); opacity:0; transition:opacity .3s; pointer-events:none; }

/* ---- Controls ---- */
.flip-ctrl { display:flex; align-items:center; gap:14px; margin-top:22px; }
.fbtn {
  padding:10px 22px; border-radius:100px; font-family:'Barlow Condensed',sans-serif;
  font-weight:700; letter-spacing:.12em; font-size:13px; cursor:pointer;
  border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.7); transition:all .2s;
}
.fbtn:hover:not(:disabled) { background:#00B140; color:#fff; border-color:#00B140; }
.fbtn:disabled { opacity:.25; cursor:default; }
.fnum { font-family:'Barlow Condensed',sans-serif; font-size:13px; letter-spacing:.1em; color:rgba(255,255,255,.4); min-width:74px; text-align:center; }

/* ---- Thumbnails ---- */
.thumbs { display:flex; gap:6px; margin-top:18px; overflow-x:auto; padding:4px 2px 10px; max-width:1040px; width:100%; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent; }
.thumbs::-webkit-scrollbar { height:6px; }
.thumbs::-webkit-scrollbar-thumb { background:rgba(255,255,255,.14); border-radius:3px; }
.thumb { flex-shrink:0; width:46px; height:65px; border-radius:3px; overflow:hidden; cursor:pointer; border:2px solid transparent; opacity:.5; transition:all .18s; background:#222; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb.active { border-color:#00B140; opacity:1; transform:translateY(-2px); }
.thumb:hover { opacity:.9; }

.hint { color:rgba(255,255,255,.3); font-family:'Barlow Condensed',sans-serif; letter-spacing:.1em; font-size:11px; margin-top:14px; }

/* ---- Mobile: single page ---- */
@media (max-width:760px) {
  .book { aspect-ratio: 827 / 1170; }
  .half.left { display:none; }
  .half.right { border-radius:6px; box-shadow:none; }
  .book-spine { display:none; }
  .leaf { width:100%; }
  .thumbs { display:none; }
}
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="cat-hero">
  <div class="container">
    <div class="eb">JP-POWER OFFICIAL</div>
    <h1>KATALOG 2026</h1>
    <p>Aksesoris JP-POWER Lengkap — Edisi Juni 2026</p>
    <div class="cat-tabs" id="catTabs"></div>
  </div>
</div>

<div class="flip-wrap">
  <div class="book-stage">
    <div class="book" id="book">
      <div class="half left"><img id="imgL" alt="Halaman kiri" /></div>
      <div class="half right"><img id="imgR" alt="Halaman kanan" /></div>
      <div class="book-spine"></div>
      <div class="leaf" id="leaf">
        <div class="leaf-face leaf-front"><img id="leafFront" alt="" /><div class="leaf-shade" id="leafShade"></div></div>
        <div class="leaf-face leaf-back"><img id="leafBack" alt="" /></div>
      </div>
    </div>
  </div>

  <div class="flip-ctrl">
    <button class="fbtn" id="btnPrev">&#8592; SEBELUMNYA</button>
    <span class="fnum" id="fnum">1 / 27</span>
    <button class="fbtn" id="btnNext">BERIKUTNYA &#8594;</button>
  </div>

  <div class="thumbs" id="thumbs"></div>
  <div class="hint">Gunakan tombol ← → keyboard, klik thumbnail, atau swipe di HP</div>
</div>

<div id="siteFooter"></div>

<script src="js/data.js?v=10"></script>
<script src="js/cart.js?v=10"></script>
<script src="js/ui.js?v=10"></script>
<script src="js/partials.js?v=10"></script>
<script src="js/render.js?v=10"></script>
<script src="js/main.js?v=10"></script>
<script>
(() => {
  const TOTAL = 54;
  const pad = n => String(n).padStart(2, '0');
  const src = n => `assets/catalog/page-${pad(n)}.jpg`;

  // Build page src array (1-indexed pages)
  const pages = [];
  for (let i = 1; i <= TOTAL; i++) pages.push(src(i));

  // Build spreads: [0,1],[2,3],... (2 pages per spread)
  const views = [];
  for (let i = 0; i < TOTAL; i += 2) {
    views.push([i, i + 1 < TOTAL ? i + 1 : null]);
  }

  // Category jump map (spread index where each section starts)
  // Pages (1-based): grommet 1, string 12, grip 19, bag 23, apparel 28, short 36,
  // support 41, socks 44, shoes 45, ball 46, tools 48, machine 53, court 54
  const tabs = [
    { label: 'SEMUA',     page: 1  },
    { label: 'GROMMET',   page: 1  },
    { label: 'SENAR',     page: 12 },
    { label: 'GRIP',      page: 19 },
    { label: 'TAS',       page: 23 },
    { label: 'APPAREL',   page: 28 },
    { label: 'SHORT',     page: 36 },
    { label: 'SUPPORT',   page: 41 },
    { label: 'SEPATU',    page: 45 },
    { label: 'BOLA',      page: 46 },
    { label: 'ALAT',      page: 48 },
    { label: 'MESIN',     page: 53 },
  ];
  const spreadOfPage = p => Math.floor((p - 1) / 2);

  const book = document.getElementById('book');
  const imgL = document.getElementById('imgL');
  const imgR = document.getElementById('imgR');
  const leaf = document.getElementById('leaf');
  const leafFront = document.getElementById('leafFront');
  const leafBack = document.getElementById('leafBack');
  const leafShade = document.getElementById('leafShade');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const fnum = document.getElementById('fnum');
  const thumbsEl = document.getElementById('thumbs');
  const tabsEl = document.getElementById('catTabs');

  let cur = 0, busy = false;

  function preload(idx) {
    [idx - 1, idx + 1].forEach(i => {
      if (i < 0 || i >= views.length) return;
      views[i].forEach(p => { if (p != null) { const im = new Image(); im.src = pages[p]; } });
    });
  }

  function render() {
    const [l, r] = views[cur];
    imgL.src = l != null ? pages[l] : '';
    imgR.src = r != null ? pages[r] : '';
    imgL.parentElement.style.visibility = l != null ? 'visible' : 'hidden';
    imgR.parentElement.style.visibility = r != null ? 'visible' : 'hidden';
    fnum.textContent = `${cur + 1} / ${views.length}`;
    btnPrev.disabled = cur === 0;
    btnNext.disabled = cur === views.length - 1;
    thumbsEl.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === cur));
    // keep active thumb in view
    const at = thumbsEl.querySelector('.thumb.active');
    if (at) at.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    preload(cur);
  }

  function turn(dir) {
    const target = dir === 'next' ? cur + 1 : cur - 1;
    if (busy || target < 0 || target >= views.length) return;
    busy = true;

    const mobile = window.matchMedia('(max-width:760px)').matches;

    if (mobile) {
      // simple fade on mobile
      cur = target; render();
      busy = false;
      return;
    }

    if (dir === 'next') {
      leaf.className = 'leaf show-right';
      leaf.style.transition = 'none';
      leaf.style.transform = 'rotateY(0deg)';
      leafFront.src = views[cur][1] != null ? pages[views[cur][1]] : '';
      leafBack.src  = views[target][0] != null ? pages[views[target][0]] : '';
      imgR.src = views[target][1] != null ? pages[views[target][1]] : '';
      imgR.parentElement.style.visibility = views[target][1] != null ? 'visible' : 'hidden';
      void leaf.offsetWidth;
      leaf.style.transition = '';
      requestAnimationFrame(() => { leaf.style.transform = 'rotateY(-180deg)'; leafShade.style.opacity = '1'; });
    } else {
      leaf.className = 'leaf show-left';
      leaf.style.transition = 'none';
      leaf.style.transform = 'rotateY(0deg)';
      leafFront.src = views[cur][0] != null ? pages[views[cur][0]] : '';
      leafBack.src  = views[target][1] != null ? pages[views[target][1]] : '';
      imgL.src = views[target][0] != null ? pages[views[target][0]] : '';
      imgL.parentElement.style.visibility = views[target][0] != null ? 'visible' : 'hidden';
      void leaf.offsetWidth;
      leaf.style.transition = '';
      requestAnimationFrame(() => { leaf.style.transform = 'rotateY(180deg)'; leafShade.style.opacity = '1'; });
    }

    setTimeout(() => {
      cur = target;
      render();
      leaf.style.transition = 'none';
      leaf.style.transform = '';
      leaf.className = 'leaf';
      leafShade.style.opacity = '0';
      void leaf.offsetWidth;
      leaf.style.transition = '';
      busy = false;
    }, 640);
  }

  function goTo(idx) {
    if (busy || idx === cur || idx < 0 || idx >= views.length) return;
    // animate one step in the right direction for nice feel, else jump
    if (Math.abs(idx - cur) === 1) { turn(idx > cur ? 'next' : 'prev'); return; }
    cur = idx; render();
  }

  // Build thumbnails (one per page)
  pages.forEach((p, i) => {
    const t = document.createElement('button');
    t.className = 'thumb';
    const im = document.createElement('img');
    im.loading = 'lazy';
    im.src = p;
    t.appendChild(im);
    t.addEventListener('click', () => goTo(Math.floor(i / 2)));
    thumbsEl.appendChild(t);
  });
  // thumbs are per-page; mark active per-spread → rebuild active logic
  function syncThumbs() {
    const [l, r] = views[cur];
    thumbsEl.querySelectorAll('.thumb').forEach((t, i) => {
      t.classList.toggle('active', i === l || i === r);
    });
  }
  const _render = render;
  render = function () { _render(); syncThumbs(); };

  // Build tabs
  tabs.forEach((tb, i) => {
    const b = document.createElement('button');
    b.className = 'cat-tab' + (i === 0 ? ' active' : '');
    b.textContent = tb.label;
    b.addEventListener('click', () => {
      tabsEl.querySelectorAll('.cat-tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      goTo(spreadOfPage(tb.page));
    });
    tabsEl.appendChild(b);
  });

  btnPrev.addEventListener('click', () => turn('prev'));
  btnNext.addEventListener('click', () => turn('next'));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') turn('next');
    if (e.key === 'ArrowLeft') turn('prev');
  });

  // Swipe support
  let sx = 0;
  book.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  book.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 50) turn(dx < 0 ? 'next' : 'prev');
  }, { passive: true });

  // Init
  render();
})();
</script>
</body>
</html>
