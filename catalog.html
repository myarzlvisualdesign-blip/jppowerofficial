<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Katalog JP-POWER 2026 | Japan Technology Badminton</title>
<meta name="description" content="Katalog digital JP-POWER 2026 — lihat semua koleksi raket, sepatu, apparel badminton." />
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=7" />
<style>
/* =========================================
   FLIPBOOK CATALOG — 3D PAGE FLIP STYLE
   ========================================= */

body { background: #1a1a1a; }

.cat-page-hero {
  background: #111;
  padding: 48px 0 32px;
  text-align: center;
}
.cat-page-hero h1 {
  font-family: 'Anton', sans-serif;
  font-size: clamp(32px, 5vw, 60px);
  color: #fff;
  letter-spacing: .06em;
  margin-bottom: 6px;
}
.cat-page-hero p { color: rgba(255,255,255,.45); font-size: 14px; margin-bottom: 24px; }

.cat-tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.cat-tab {
  padding: 7px 20px;
  border-radius: 100px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: .1em;
  font-size: 12px;
  cursor: pointer;
  border: 1.5px solid rgba(255,255,255,.2);
  color: rgba(255,255,255,.6);
  background: transparent;
  transition: all .2s;
}
.cat-tab.active, .cat-tab:hover {
  background: #00B140;
  color: #fff;
  border-color: #00B140;
}

/* ---- Flipbook Stage ---- */
.flipbook-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px 60px;
  background: #1a1a1a;
  min-height: calc(100vh - 200px);
}

.book-stage {
  perspective: 2400px;
  width: 100%;
  max-width: 960px;
  display: flex;
  justify-content: center;
}

/* The open book container */
.book-open {
  position: relative;
  display: flex;
  width: 100%;
  max-width: 940px;
  height: 600px;
  box-shadow: 0 40px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04);
  border-radius: 3px 8px 8px 3px;
  transform-style: preserve-3d;
}

/* Spine */
.book-spine {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 16px;
  transform: translateX(-50%);
  background: linear-gradient(to right, #0a0a0a, #2a2a2a 40%, #1a1a1a 60%, #0a0a0a);
  z-index: 10;
  box-shadow: inset -2px 0 4px rgba(0,0,0,.5), inset 2px 0 4px rgba(0,0,0,.5);
}

/* Page halves */
.page-left,
.page-right {
  flex: 1;
  position: relative;
  overflow: hidden;
  transform-style: preserve-3d;
}
.page-left {
  border-radius: 3px 0 0 3px;
  transform-origin: right center;
}
.page-right {
  border-radius: 0 8px 8px 0;
  transform-origin: left center;
}

/* Page flip animation classes */
.page-left.flip-out {
  animation: flipOutLeft .45s cubic-bezier(.645,.045,.355,1) forwards;
}
.page-right.flip-in {
  animation: flipInRight .45s cubic-bezier(.645,.045,.355,1) forwards;
}
.page-right.flip-out {
  animation: flipOutRight .45s cubic-bezier(.645,.045,.355,1) forwards;
}
.page-left.flip-in {
  animation: flipInLeft .45s cubic-bezier(.645,.045,.355,1) forwards;
}

@keyframes flipOutLeft {
  0%   { transform: rotateY(0deg); box-shadow: none; }
  50%  { transform: rotateY(-90deg); box-shadow: inset -10px 0 30px rgba(0,0,0,.4); }
  100% { transform: rotateY(-180deg); opacity: 0; }
}
@keyframes flipInRight {
  0%   { transform: rotateY(180deg); opacity: 0; }
  50%  { transform: rotateY(90deg); box-shadow: inset 10px 0 30px rgba(0,0,0,.4); }
  100% { transform: rotateY(0deg); }
}
@keyframes flipOutRight {
  0%   { transform: rotateY(0deg); }
  50%  { transform: rotateY(90deg); box-shadow: inset 10px 0 30px rgba(0,0,0,.4); }
  100% { transform: rotateY(180deg); opacity: 0; }
}
@keyframes flipInLeft {
  0%   { transform: rotateY(-180deg); opacity: 0; }
  50%  { transform: rotateY(-90deg); box-shadow: inset -10px 0 30px rgba(0,0,0,.4); }
  100% { transform: rotateY(0deg); }
}

/* Shadow overlay on pages during flip */
.page-left::after,
.page-right::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}
.page-right::after { box-shadow: inset 4px 0 20px rgba(0,0,0,.15); }
.page-left::after  { box-shadow: inset -4px 0 20px rgba(0,0,0,.15); }

/* ---- Page content themes ---- */
.pg {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.pg-cover {
  background: linear-gradient(135deg, #0a1a0a 0%, #0d2e0d 50%, #0a1a0a 100%);
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #fff;
  padding: 40px 30px;
  position: relative;
}
.pg-cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 60% 30%, rgba(0,177,64,.18) 0%, transparent 70%);
}
.pg-cover-logo { width: 64px; margin-bottom: 16px; position: relative; z-index: 1; filter: brightness(0) invert(1); }
.pg-cover-year { font-family: 'Anton', sans-serif; font-size: 72px; color: #00B140; line-height: 1; position: relative; z-index: 1; }
.pg-cover-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: .2em; font-size: 14px; color: rgba(255,255,255,.6); margin-bottom: 6px; position: relative; z-index: 1; }
.pg-cover-line { width: 48px; height: 3px; background: #00B140; margin: 14px auto; position: relative; z-index: 1; }
.pg-cover-sub { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .15em; font-size: 11px; color: rgba(255,255,255,.4); position: relative; z-index: 1; }

.pg-white { background: #fff; color: #111; }
.pg-dark  { background: #0f1f0f; color: #fff; }
.pg-grey  { background: #f5f5f5; color: #111; }
.pg-green { background: #00B140; color: #fff; }

.pg-inner { padding: 32px 28px; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }

.pg-eyebrow {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: .22em;
  font-size: 10px;
  color: #00B140;
  margin-bottom: 6px;
}
.pg-dark .pg-eyebrow { color: #4ade80; }
.pg-green .pg-eyebrow { color: rgba(255,255,255,.7); }

.pg-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(20px, 2.5vw, 30px);
  letter-spacing: .04em;
  line-height: 1.1;
  margin-bottom: 12px;
}
.pg-dark .pg-title { color: #fff; }
.pg-green .pg-title { color: #fff; }

.pg-desc {
  font-size: 12px;
  line-height: 1.65;
  color: #555;
  margin-bottom: 12px;
}
.pg-dark .pg-desc { color: rgba(255,255,255,.55); }
.pg-green .pg-desc { color: rgba(255,255,255,.8); }

.pg-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px;
  letter-spacing: .2em;
  color: #bbb;
  margin-top: auto;
  text-align: right;
}
.pg-dark .pg-num { color: rgba(255,255,255,.25); }

/* Product grid */
.pg-prod-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  flex: 1;
  min-height: 0;
}
.pg-prod-card {
  background: #f8f8f8;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #eee;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: transform .2s;
}
.pg-prod-card:hover { transform: scale(1.02); }
.pg-prod-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.pg-prod-card-info { padding: 8px 10px; }
.pg-prod-card-info h5 { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .04em; margin-bottom: 2px; color: #111; }
.pg-prod-card-info .price { font-family: 'Oswald', sans-serif; font-size: 12px; color: #00B140; }
.pg-dark .pg-prod-card { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.1); }
.pg-dark .pg-prod-card-info h5 { color: #fff; }

/* Feature image */
.pg-feat-img {
  flex: 1;
  min-height: 0;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 12px;
}
.pg-feat-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Spec table */
.pg-specs { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
.pg-specs tr { border-bottom: 1px solid #eee; }
.pg-specs td { padding: 6px 3px; }
.pg-specs td:first-child { color: #888; }
.pg-specs td:last-child { font-weight: 600; text-align: right; }
.pg-dark .pg-specs tr { border-color: rgba(255,255,255,.08); }
.pg-dark .pg-specs td:first-child { color: rgba(255,255,255,.4); }
.pg-dark .pg-specs td:last-child { color: #fff; }

/* Price */
.pg-price { font-family: 'Oswald', sans-serif; font-size: 20px; color: #00B140; font-weight: 600; }
.pg-price-old { font-size: 12px; color: #aaa; text-decoration: line-through; margin-right: 6px; }
.pg-badge { background: #e50914; color: #fff; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 10px; padding: 3px 7px; border-radius: 4px; letter-spacing: .1em; }

/* TOC */
.pg-toc { list-style: none; padding: 0; margin: 0; flex: 1; }
.pg-toc li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid #eee;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .06em;
  cursor: pointer;
  transition: color .15s;
}
.pg-toc li:hover { color: #00B140; }
.pg-toc .dot { flex: 1; margin: 0 10px; border-bottom: 1px dotted #ccc; }
.pg-toc .pn { font-size: 11px; color: #aaa; }

/* ---- Controls ---- */
.flip-controls {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 28px;
}
.flip-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 11px 26px;
  border-radius: 100px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: .12em;
  font-size: 13px;
  cursor: pointer;
  transition: all .2s;
  border: 2px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.05);
  color: rgba(255,255,255,.7);
}
.flip-btn:hover { background: #00B140; color: #fff; border-color: #00B140; }
.flip-btn:disabled { opacity: .25; pointer-events: none; }
.flip-page-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  letter-spacing: .1em;
  color: rgba(255,255,255,.4);
  min-width: 60px;
  text-align: center;
}

/* Thumbnails */
.flip-thumbs {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.15) transparent;
  max-width: 940px;
  width: 100%;
}
.flip-thumb {
  flex-shrink: 0;
  width: 60px;
  height: 40px;
  border-radius: 4px;
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color .2s, transform .2s;
  opacity: .5;
}
.flip-thumb.active { border-color: #00B140; opacity: 1; transform: scale(1.05); }
.flip-thumb:hover { opacity: .9; }
.flip-thumb canvas, .flip-thumb-inner {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .05em;
}

/* ---- Mobile ---- */
@media (max-width: 768px) {
  .book-open { flex-direction: column; height: auto; max-height: none; }
  .page-left, .page-right { border-radius: 0; }
  .page-left { border-radius: 8px 8px 0 0; }
  .page-right { border-radius: 0 0 8px 8px; }
  .book-spine { display: none; }
  .pg-inner { padding: 22px 18px; }
  .pg-title { font-size: 18px; }
  .flip-thumbs { display: none; }
}
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="cat-page-hero">
  <div class="container">
    <p style="font-family:'Barlow Condensed',sans-serif;letter-spacing:.25em;font-size:11px;color:rgba(255,255,255,.35);margin-bottom:4px">JP-POWER OFFICIAL</p>

    },

    // 2 — Featured Future 66 III
    {
      label: 'FEATURED',
      left: `

    // 3 — Shoes
    {

      left: `
        <div class="pg pg-green">
          <div class="pg-inner">
            <div class="pg-eyebrow">CHAPTER 02</div>

      right: `

            <div class="pg-title">KOLEKSI SEPATU</div>
            <div class="pg-prod-grid">${prodGrid(prods.filter(p => p.category==='shoes'))}</div>
            <div class="pg-num">8</div>
          </div>
        </div>`
    },

    // 4 — Apparel
    {
      label: 'APPAREL',
      left: `
        <div class="pg pg-white">
          <div class="pg-inner">
            <div class="pg-eyebrow">CHAPTER 03</div>
            <div class="pg-title">APPAREL</div>
            <div class="pg-desc">Jersey premium — quick-dry, breathable, stretchable. Tampil stylish di lapangan.</div>
            <div class="pg-prod-grid">${prodGrid(prods.filter(p => p.category==='apparel'))}</div>
            <div class="pg-num">9</div>
          </div>
        </div>`,
      right: `
        <div class="pg pg-dark">
          <div class="pg-inner">
            <div class="pg-eyebrow">FEATURED SET</div>
            <div class="pg-title">HYBRID RN-8000</div>

    },

    // 5 — String & Grip
    {
      label: 'AKSESORI',

    // 7 — Contact + Back cover
    {
      label: 'INFO',
      left: `

      right: `

          <img class="pg-cover-logo" src="assets/logo.png" alt="JP-POWER" style="width:80px" />
          <div class="pg-cover-line" style="background:rgba(255,255,255,.4)"></div>
          <div class="pg-cover-title">TERIMA KASIH</div>
          <div style="font-family:'Anton',sans-serif;font-size:28px;color:#fff;letter-spacing:.06em;position:relative;z-index:1">JP-POWER</div>
          <div class="pg-cover-sub" style="margin-top:8px">JAPAN TECHNOLOGY ★★★★★</div>
          <div class="pg-cover-line" style="background:rgba(255,255,255,.4)"></div>

  // ---- State ----
  let current = 0;
  let animating = false;
  const pageLeft  = document.getElementById('pageLeft');
  const pageRight = document.getElementById('pageRight');
  const prevBtn   = document.getElementById('flipPrev');
  const nextBtn   = document.getElementById('flipNext');
  const numEl     = document.getElementById('flipNum');
  const thumbsEl  = document.getElementById('flipThumbs');

  // ---- Build thumbnails ----
  spreads.forEach((s, i) => {
    const t = document.createElement('button');
    t.className = 'flip-thumb' + (i===0?' active':'');
    t.innerHTML = `<div class="flip-thumb-inner" style="background:${i===0?'#0a1a0a':'#f5f5f5'};color:${i===0?'#fff':'#111'}">${s.label}</div>`;
    t.addEventListener('click', () => goTo(i, i > current ? 'next' : 'prev'));
    thumbsEl.appendChild(t);
  });

  // ---- Render ----
  function renderSpread(idx) {
    pageLeft.innerHTML  = spreads[idx].left;
    pageRight.innerHTML = spreads[idx].right;
    // wire TOC links
    document.querySelectorAll('[data-go]').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => goTo(+el.dataset.go, +el.dataset.go > current ? 'next' : 'prev'));
    });
  }

  function goTo(idx, dir) {
    if (animating || idx === current || idx < 0 || idx >= spreads.length) return;
    animating = true;
    const outClass = dir === 'next' ? 'flip-out' : 'flip-out';
    const inClass  = dir === 'next' ? 'flip-in'  : 'flip-in';

    // Animate: right page flips for next, left page for prev
    const animPage = dir === 'next' ? pageRight : pageLeft;
    const flipOutAnim = dir === 'next' ? 'flipOutRight' : 'flipOutLeft';
    const flipInAnim  = dir === 'next' ? 'flipInLeft'   : 'flipInRight';

    animPage.style.animation = `${flipOutAnim} .4s cubic-bezier(.645,.045,.355,1) forwards`;

    setTimeout(() => {
      current = idx;
      renderSpread(current);
      numEl.textContent = `${current + 1} / ${spreads.length}`;
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === spreads.length - 1;
      // Update thumbnails
      thumbsEl.querySelectorAll('.flip-thumb').forEach((t, i) => t.classList.toggle('active', i===current));
      // Animate in
      animPage.style.animation = `${flipInAnim} .4s cubic-bezier(.645,.045,.355,1) forwards`;
      setTimeout(() => { animPage.style.animation = ''; animating = false; }, 420);
    }, 400);
  }

  prevBtn.addEventListener('click', () => goTo(current - 1, 'prev'));
  nextBtn.addEventListener('click', () => goTo(current + 1, 'next'));

  // Tab buttons in hero
  document.querySelectorAll('.cat-tab[data-go]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      goTo(+btn.dataset.go, +btn.dataset.go > current ? 'next' : 'prev');
    });
  });

  // Keyboard nav
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') goTo(current + 1, 'next');
    if (e.key === 'ArrowLeft')  goTo(current - 1, 'prev');
  });

  // Initial render
  renderSpread(0);
  prevBtn.disabled = true;
})();
</script>
