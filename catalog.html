/* ===== FLIPBOOK CATALOG STYLES ===== */
.catalog-hero {
  background: var(--ink);
  padding: 60px 0 40px;
  text-align: center;
  color: #fff;
}
.catalog-hero h1 {
  font-family: 'Anton', sans-serif;
  font-size: clamp(36px, 6vw, 72px);
  letter-spacing: .05em;
  margin-bottom: 8px;
}
.catalog-hero p {
  color: rgba(255,255,255,.6);
  font-size: 15px;
  margin-bottom: 28px;
}
.catalog-hero .hero-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
.hero-tab {
  padding: 8px 22px;
  border-radius: 100px;
  border: 1px solid rgba(255,255,255,.25);
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: .1em;
  font-size: 13px;
  color: rgba(255,255,255,.7);
  cursor: pointer;
  background: transparent;
  transition: all .2s;
}
.hero-tab.active, .hero-tab:hover { background: var(--green); color: #fff; border-color: var(--green); }

/* Flipbook container */
.flipbook-section {
  background: #f0f0f0;
  padding: 40px 0 60px;
  min-height: 80vh;
}
.flipbook-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}
.flipbook-stage {
  perspective: 2000px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 20px 0;
}
.flipbook {
  position: relative;
  display: flex;
  gap: 4px;
}
/* Two-page spread */
.flip-spread {
  display: flex;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  border-radius: 4px 4px 2px 2px;
  overflow: hidden;
  max-width: 960px;
  width: 100%;
}
.flip-page {
  flex: 1;
  min-height: 560px;
  position: relative;
  overflow: hidden;
}
.flip-page-left {
  border-right: 2px solid rgba(0,0,0,.08);
}

/* Page variants */
.page-cover {
  background: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 40px;
  text-align: center;
}
.page-cover .cover-logo { width: 80px; margin-bottom: 20px; filter: brightness(0) invert(1); }
.page-cover h2 { font-family: 'Anton', sans-serif; font-size: 48px; letter-spacing: .06em; margin-bottom: 6px; }
.page-cover .cover-sub { font-family: 'Barlow Condensed', sans-serif; letter-spacing: .2em; font-size: 13px; color: rgba(255,255,255,.55); margin-bottom: 32px; }
.page-cover .cover-year { font-family: 'Barlow Condensed', sans-serif; font-size: 80px; font-weight: 800; color: var(--green); line-height: 1; }
.page-cover .cover-stripe { width: 60px; height: 3px; background: var(--green); margin: 20px auto; }

.page-white { background: #fff; }
.page-dark { background: var(--ink); color: #fff; }
.page-green { background: var(--green); color: #fff; }
.page-grey { background: #f8f8f8; }

/* Page content layouts */
.page-inner {
  padding: 32px 28px;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.page-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  letter-spacing: .2em;
  color: var(--grey-400);
  margin-bottom: auto;
  align-self: flex-end;
}
.page-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: .2em;
  font-size: 11px;
  color: var(--green);
  margin-bottom: 8px;
}
.page-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(22px, 3vw, 34px);
  letter-spacing: .04em;
  margin-bottom: 14px;
  line-height: 1.1;
}
.page-desc {
  font-size: 13px;
  color: var(--grey-600);
  line-height: 1.65;
  margin-bottom: 16px;
}

/* Product grid inside page */
.page-product-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  flex: 1;
}
.page-product-item {
  background: var(--grey-50);
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--grey-100);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.page-product-item:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
.page-product-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
.page-product-info { padding: 10px 12px; }
.page-product-info h5 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .04em; margin-bottom: 3px; }
.page-product-info .price { font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; color: var(--green); }

/* Single product feature */
.page-feature-img {
  flex: 1;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 16px;
}
.page-feature-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Spec table inside page */
.page-spec-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
.page-spec-table tr { border-bottom: 1px solid var(--grey-100); }
.page-spec-table td { padding: 7px 4px; }
.page-spec-table td:first-child { color: var(--grey-500); width: 40%; }
.page-spec-table td:last-child { font-weight: 600; color: var(--ink); }

/* Price badge */
.page-price-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
}
.page-price-main { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; color: var(--green); }
.page-price-old { font-size: 13px; color: var(--grey-400); text-decoration: line-through; }
.page-badge { background: var(--red); color: #fff; font-size: 11px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: .1em; }

/* TOC page */
.toc-list { list-style: none; padding: 0; margin: 0; flex: 1; }
.toc-list li { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--grey-100); font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: .06em; cursor: pointer; }
.toc-list li:hover { color: var(--green); }
.toc-list .toc-dot { flex: 1; margin: 0 12px; border-bottom: 1px dotted var(--grey-300); }
.toc-list .toc-page { font-size: 13px; color: var(--grey-500); }

/* Dark page adaptations */
.page-dark .page-label { color: var(--green-neon); }
.page-dark .page-title { color: #fff; }
.page-dark .page-desc { color: rgba(255,255,255,.6); }
.page-dark .page-num { color: rgba(255,255,255,.3); }
.page-dark .page-product-item { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.1); }
.page-dark .page-product-info h5 { color: #fff; }
.page-green .page-label, .page-green .page-num { color: rgba(255,255,255,.6); }
.page-green .page-title { color: #fff; }

/* Navigation controls */
.flipbook-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 28px;
}
.flip-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 28px;
  border-radius: 100px;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: .12em;
  font-size: 14px;
  cursor: pointer;
  transition: all .2s;
  border: 2px solid var(--ink);
  background: #fff;
  color: var(--ink);

.flip-btn:hover { background: var(--ink); color: #fff; }
.flip-btn.active-btn { background: var(--green); color: #fff; border-color: var(--green); }
.flip-btn:disabled { opacity: .35; pointer-events: none; }
.flip-indicator {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  letter-spacing: .1em;
  color: var(--grey-500);
  min-width: 80px;
  text-align: center;

/* Page transition */
.flip-spread {
  transition: opacity .35s ease;
}
.flip-spread.flipping { opacity: 0; transform: scale(.98); }

/* Mobile */
@media (max-width: 768px) {
  .flip-spread { flex-direction: column; }
  .flip-page-left { border-right: none; border-bottom: 2px solid rgba(0,0,0,.08); }
  .flip-page { min-height: 400px; }
  .page-inner { padding: 24px 20px; }
  .page-title { font-size: 22px; }
}
@media (max-width: 480px) {
  .flip-page { min-height: 320px; }
}
</style>

              <div style="padding:14px;background:var(--green);border-radius:10px;color:#fff">
                <div style="font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;margin-bottom:4px">PARTNER STORE</div>
                <div style="font-size:13px;opacity:.85">Jakarta · Bandung · Surabaya</div>
                <div style="font-size:13px;opacity:.85">Yogyakarta · Medan · Bali</div>
              </div>
            </div>
            <div class="page-num">15</div>
          </div>
        `
      },
      right: {
        html: `
          <div class="page-cover" style="background:var(--green)">
            <div style="font-family:'Barlow Condensed',sans-serif;letter-spacing:.3em;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:20px">JAPAN TECHNOLOGY ★★★★★</div>
            <img class="cover-logo" src="assets/logo.png" alt="JP-POWER" style="width:120px" />
            <div style="margin-top:20px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.14em;font-size:16px;color:rgba(255,255,255,.9)">OFFICIAL PRODUCT CATALOG</div>
            <div style="margin-top:8px;font-size:13px;color:rgba(255,255,255,.6)">2026 Edition</div>
            <a href="product.html" class="btn btn-white" style="margin-top:28px"><span>BELANJA SEKARANG →</span></a>
          </div>
        `
      }
    }
  ];

  // ---- Render engine ----
  let currentSpread = 0;
  const spreadEl = document.getElementById('flipSpread');
  const prevBtn = document.getElementById('flipPrev');
  const nextBtn = document.getElementById('flipNext');
  const indicator = document.getElementById('flipIndicator');

  function renderPage(pageData) {
    const div = document.createElement('div');
    div.className = 'flip-page';
    div.innerHTML = pageData.html;
    // inject products if any
    if (pageData.products && pageData.products.length) {
      const grid = div.querySelector('.page-product-grid');
      if (grid) {
        grid.innerHTML = pageData.products.map(p => `
          <a href="product-detail.html?id=${p.id}" class="page-product-item">
            <img src="${p.image}" alt="${p.name}" />
            <div class="page-product-info">
              <h5>${p.name}</h5>
              <div class="price">${fmt(p.price)}</div>
            </div>
          </a>
        `).join('');
      }
    }
    return div;
  }

  function goToSpread(idx) {
    idx = Math.max(0, Math.min(pages.length - 1, idx));
    spreadEl.classList.add('flipping');
    setTimeout(() => {
      spreadEl.innerHTML = '';
      const leftPage = renderPage(pages[idx].left);
      leftPage.classList.add('flip-page-left');
      const rightPage = renderPage(pages[idx].right);
      spreadEl.appendChild(leftPage);
      spreadEl.appendChild(rightPage);
      currentSpread = idx;
      indicator.textContent = `${idx + 1} / ${pages.length}`;
      prevBtn.disabled = idx === 0;
      nextBtn.disabled = idx === pages.length - 1;
      spreadEl.classList.remove('flipping');
    }, 350);
  }

  window.gotoChapter = (idx) => goToSpread(idx);

  prevBtn.addEventListener('click', () => goToSpread(currentSpread - 1));
  nextBtn.addEventListener('click', () => goToSpread(currentSpread + 1));

  // Chapter tabs
  const chapterMap = { all: 0, raket: 1, shoes: 3, apparel: 4, aksesoris: 5 };
  document.querySelectorAll('.hero-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.hero-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const ch = tab.dataset.chapter;
      goToSpread(chapterMap[ch] || 0);
    });
  });

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goToSpread(currentSpread + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goToSpread(currentSpread - 1);
  });

  // Initial render
  setTimeout(() => goToSpread(0), 100);
})();
</script>
</body>
</html>
