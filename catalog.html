<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Katalog JP-POWER 2026 | Japan Technology Badminton</title>
<meta name="description" content="Katalog digital lengkap JP-POWER Juni 2026 — grommet, senar, grip, tas, apparel, sepatu, support, dan alat stringing." />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon.png" />
<link rel="shortcut icon" type="image/png" href="assets/icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=25" />
<style>
* { box-sizing: border-box; }
body { background: #ececef; margin: 0; }

/* ---- Slim top bar ---- */
.cat-hero { background: #0d0f11; padding: 26px 0 18px; text-align: center; }
.cat-hero .eb { font-family:'Barlow Condensed',sans-serif; letter-spacing:.26em; font-size:11px; color:rgba(255,255,255,.32); margin-bottom:3px; }
.cat-hero h1 { font-family:'Anton',sans-serif; font-size:clamp(24px,3.4vw,42px); color:#fff; letter-spacing:.06em; margin:0 0 4px; }
.cat-hero p { color:rgba(255,255,255,.4); font-size:12px; margin:0 0 16px; }
.cat-tabs { display:flex; justify-content:center; gap:7px; flex-wrap:wrap; padding:0 16px; }
.cat-tab {
  padding:6px 16px; border-radius:100px; font-family:'Barlow Condensed',sans-serif;
  font-weight:700; letter-spacing:.1em; font-size:12px; cursor:pointer;
  border:1.5px solid rgba(255,255,255,.16); color:rgba(255,255,255,.55);
  background:transparent; transition:all .2s;
}
.cat-tab.active, .cat-tab:hover { background:#00B140; color:#fff; border-color:#00B140; }

/* ---- StPageFlip book stage ---- */
.viewer-fs { background:#ececef; }
.viewer {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 70px 16px;
  min-height: min(74vh, 760px);
}
#book {
  width: 100%;
  max-width: 1060px;
  max-height: calc(100vh - 220px);
  margin: 0 auto;
}
#book .page { background: #fff; box-shadow: 0 0 1px rgba(0,0,0,.1); }
#book .page img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ---- Big side arrows ---- */
.side-arrow {
  position:absolute; top:50%; transform:translateY(-50%);
  width:48px; height:64px; border:none; cursor:pointer;
  background:rgba(120,120,128,.45); color:#fff;
  border-radius:8px; font-size:30px; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition:background .2s, opacity .2s; z-index:20;
}
.side-arrow:hover:not(:disabled){ background:rgba(0,177,64,.85); }
.side-arrow:disabled{ opacity:.2; cursor:default; }
.side-prev{ left:14px; }
.side-next{ right:14px; }

/* ---- Bottom toolbar ---- */
.viewer-bar {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; background:#fff; border-top:1px solid #e2e2e6;
  padding:8px 18px; box-shadow:0 -4px 16px rgba(0,0,0,.05);
}
.vb-group { display:flex; align-items:center; gap:4px; }
.vb-btn {
  width:38px; height:38px; border:none; background:transparent; cursor:pointer;
  border-radius:8px; color:#444; display:flex; align-items:center; justify-content:center;
  transition:background .15s, color .15s;
}
.vb-btn:hover:not(:disabled){ background:#f0f0f2; color:#00B140; }
.vb-btn:disabled{ opacity:.3; cursor:default; }
.vb-btn svg{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.vb-num {
  font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.06em;
  font-size:14px; color:#333; padding:0 12px; min-width:96px; text-align:center;
  white-space:nowrap;
}
.vb-divider { width:1px; height:24px; background:#e2e2e6; margin:0 6px; }

/* ---- Thumbnails drawer ---- */
.thumbs {
  display:flex; gap:6px; background:#f6f6f8; border-top:1px solid #e2e2e6;
  overflow-x:auto; padding:10px 14px; max-height:0; transition:max-height .3s, padding .3s;
  overflow-y:hidden; padding-top:0; padding-bottom:0;
}
.thumbs.open { max-height:110px; padding-top:10px; padding-bottom:12px; }
.thumbs::-webkit-scrollbar { height:7px; }
.thumbs::-webkit-scrollbar-thumb { background:rgba(0,0,0,.2); border-radius:4px; }
.thumb { flex-shrink:0; width:54px; height:76px; border-radius:3px; overflow:hidden; cursor:pointer; border:2px solid transparent; opacity:.6; transition:all .18s; background:#ddd; padding:0; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb.active { border-color:#00B140; opacity:1; }
.thumb:hover { opacity:1; }

/* ---- Fullscreen ---- */
.viewer-fs:fullscreen,
.viewer-fs:-webkit-full-screen {
  background: #1a1a1a;
  width: 100vw; height: 100vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.viewer-fs:fullscreen .viewer,
.viewer-fs:-webkit-full-screen .viewer { flex: 1; min-height: 0; padding: 24px 80px; }
.viewer-fs:fullscreen #book,
.viewer-fs:-webkit-full-screen #book {
  /* Don't over-zoom: cap width to leave breathing room, cap height to fit between toolbar+padding */
  width: 100%;
  max-width: min(82vw, calc((100vh - 140px) * 1.5));
  max-height: calc(100vh - 140px);
  margin: 0 auto;
}
.viewer-fs:fullscreen .viewer-bar,
.viewer-fs:-webkit-full-screen .viewer-bar {
  background: #0d0f11; border-top-color: #2a2c30;
}
.viewer-fs:fullscreen .vb-btn,
.viewer-fs:-webkit-full-screen .vb-btn { color: #ddd; }
.viewer-fs:fullscreen .vb-btn:hover:not(:disabled),
.viewer-fs:-webkit-full-screen .vb-btn:hover:not(:disabled) {
  background: rgba(255,255,255,.08); color: #00B140;
}
.viewer-fs:fullscreen .vb-num,
.viewer-fs:-webkit-full-screen .vb-num { color: #ddd; }
.viewer-fs:fullscreen .thumbs,
.viewer-fs:-webkit-full-screen .thumbs { background: #181a1d; border-top-color: #2a2c30; }
.viewer-fs:fullscreen .side-arrow,
.viewer-fs:-webkit-full-screen .side-arrow { background: rgba(255,255,255,.12); }

/* ---- Mobile (single-page mode via library auto-detect) ---- */
@media (max-width:760px) {
  .viewer { padding:10px 38px 8px; min-height:0; }
  #book {
    /* Constrain width so StPageFlip auto-switches to portrait (1-page) mode */
    max-width: min(85vw, 360px);
    max-height: calc(100vh - 200px);
  }
  .side-arrow { width:32px; height:44px; font-size:22px; opacity:.9; }
  .side-prev{ left:2px; } .side-next{ right:2px; }
  .vb-num { min-width:80px; font-size:12px; }
  .viewer-bar { padding:6px 8px; }
  .vb-btn { width:32px; height:32px; }
  .cat-hero { padding:18px 0 12px; }
  .cat-hero h1 { font-size:22px; }
  .cat-hero p { display:none; }
}
@media (max-width:420px) {
  .viewer { padding:6px 26px 6px; }
  .side-arrow { width:26px; height:36px; font-size:18px; }
  .side-prev{ left:0; } .side-next{ right:0; }
  .vb-btn { width:28px; height:28px; }
  .vb-num { min-width:64px; font-size:11px; }
  #book { max-width: min(88vw, 320px); }
}

/* Mobile fullscreen — keep single-page, tighter padding */
@media (max-width:760px) {
  .viewer-fs:fullscreen .viewer,
  .viewer-fs:-webkit-full-screen .viewer { padding: 14px 24px; }
  .viewer-fs:fullscreen #book,
  .viewer-fs:-webkit-full-screen #book {
    max-width: min(80vw, calc((100vh - 120px) * 0.707));
    max-height: calc(100vh - 120px);
  }
}

.hint { text-align:center; color:#999; font-family:'Barlow Condensed',sans-serif; letter-spacing:.08em; font-size:11px; padding:10px; }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="cat-hero">
  <div class="container">
    <div class="eb">JP-POWER OFFICIAL</div>
    <h1>KATALOG 2026</h1>
    <p>Aksesoris JP-POWER Lengkap — Edisi Juni 2026</p>
    <div class="cat-tabs" id="catTabs"></div>
  </div>
</div>

<div class="viewer-fs" id="viewerFs">
  <div class="viewer">
    <button class="side-arrow side-prev" id="sidePrev" aria-label="Sebelumnya">&#8249;</button>
    <div id="book"></div>
    <button class="side-arrow side-next" id="sideNext" aria-label="Berikutnya">&#8250;</button>
  </div>

  <!-- Bottom toolbar -->
  <div class="viewer-bar">
    <div class="vb-group">
      <button class="vb-btn" id="vbThumbs" title="Thumbnail / Daftar Halaman">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
    </div>

    <div class="vb-group">
      <button class="vb-btn" id="vbFirst" title="Halaman pertama">
        <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
      </button>
      <button class="vb-btn" id="vbPrev" title="Sebelumnya">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="vb-num" id="vbNum">1 / 54</span>
      <button class="vb-btn" id="vbNext" title="Berikutnya">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="vb-btn" id="vbLast" title="Halaman terakhir">
        <svg viewBox="0 0 24 24"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
      </button>
    </div>

    <div class="vb-group">
      <button class="vb-btn" id="vbFull" title="Layar penuh">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </div>

  <!-- Thumbnail drawer -->
  <div class="thumbs" id="thumbs"></div>
</div>

<div class="hint">Klik tombol panah / drag pojok halaman / swipe di HP &nbsp;·&nbsp; halaman membungkuk seperti kertas asli</div>

<div id="siteFooter"></div>

<script src="js/data.js?v=25"></script>
<script src="js/cart.js?v=25"></script>
<script src="js/ui.js?v=25"></script>
<script src="js/partials.js?v=25"></script>
<script src="js/render.js?v=25"></script>
<script src="js/main.js?v=25"></script>
<!-- StPageFlip — same library that powers flbook-style page turn -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(() => {
  const TOTAL = 54;
  const pad = n => String(n).padStart(2,'0');
  const pages = [];
  for (let i = 1; i <= TOTAL; i++) pages.push(`assets/catalog/page-${pad(i)}.jpg`);

  // Category jump points (1-based page numbers)
  const tabs = [
    { label:'SEMUA', page:1 }, { label:'GROMMET', page:1 }, { label:'SENAR', page:12 },
    { label:'GRIP', page:19 }, { label:'TAS', page:23 }, { label:'APPAREL', page:28 },
    { label:'SHORT', page:36 }, { label:'SUPPORT', page:41 }, { label:'SEPATU', page:45 },
    { label:'BOLA', page:46 }, { label:'ALAT', page:48 }, { label:'MESIN', page:53 },
  ];

  const $ = id => document.getElementById(id);
  const bookEl = $('book'), vbNum = $('vbNum');
  const sidePrev = $('sidePrev'), sideNext = $('sideNext');
  const tabsEl = $('catTabs'), thumbsEl = $('thumbs');

  // Initialize StPageFlip — the real paper-bend library
  const pageFlip = new St.PageFlip(bookEl, {
    width: 550,
    height: 733,
    size: 'stretch',
    minWidth: 280,
    maxWidth: 1000,
    minHeight: 380,
    maxHeight: 1400,
    maxShadowOpacity: 0.5,
    showCover: false,
    mobileScrollSupport: false,
    usePortrait: true,           // 1 page in portrait, 2 in landscape (auto-switch)
    drawShadow: true,
    flippingTime: 700,
    startZIndex: 1,
    autoSize: true,
    showPageCorners: true,        // show corner peek-to-flip hint
    disableFlipByClick: false,
  });

  // Load all 54 images
  pageFlip.loadFromImages(pages);

  function updateUI() {
    const cur = pageFlip.getCurrentPageIndex();   // 0-based
    const total = pageFlip.getPageCount();
    const orientation = pageFlip.getOrientation(); // 'landscape' | 'portrait'
    if (orientation === 'landscape' && cur + 1 < total && cur > 0) {
      vbNum.textContent = `${cur+1}–${cur+2} / ${total}`;
    } else {
      vbNum.textContent = `${cur+1} / ${total}`;
    }
    sidePrev.disabled = $('vbPrev').disabled = $('vbFirst').disabled = (cur <= 0);
    const atEnd = cur >= total - 1;
    sideNext.disabled = $('vbNext').disabled = $('vbLast').disabled = atEnd;
    // Update thumbnails
    thumbsEl.querySelectorAll('.thumb').forEach((t, i) => {
      const on = orientation === 'landscape'
        ? (i === cur || i === cur + 1)
        : (i === cur);
      t.classList.toggle('active', on);
    });
    const at = thumbsEl.querySelector('.thumb.active');
    if (at) at.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
  }

  pageFlip.on('flip', updateUI);
  pageFlip.on('changeOrientation', updateUI);
  setTimeout(updateUI, 200);

  // Build thumbnails
  pages.forEach((p, i) => {
    const t = document.createElement('button');
    t.className = 'thumb';
    const im = document.createElement('img');
    im.loading = 'lazy';
    im.src = p;
    t.appendChild(im);
    t.addEventListener('click', () => pageFlip.flip(i, 'top'));
    thumbsEl.appendChild(t);
  });

  // Category tabs
  tabs.forEach((tb, i) => {
    const b = document.createElement('button');
    b.className = 'cat-tab' + (i === 0 ? ' active' : '');
    b.textContent = tb.label;
    b.addEventListener('click', () => {
      tabsEl.querySelectorAll('.cat-tab').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      pageFlip.flip(tb.page - 1, 'top');
    });
    tabsEl.appendChild(b);
  });

  // Controls
  $('vbPrev').onclick = () => pageFlip.flipPrev();
  $('vbNext').onclick = () => pageFlip.flipNext();
  sidePrev.onclick = () => pageFlip.flipPrev();
  sideNext.onclick = () => pageFlip.flipNext();
  $('vbFirst').onclick = () => pageFlip.flip(0, 'top');
  $('vbLast').onclick = () => pageFlip.flip(TOTAL - 1, 'top');
  $('vbThumbs').onclick = () => thumbsEl.classList.toggle('open');
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') pageFlip.flipNext();
    if (e.key === 'ArrowLeft') pageFlip.flipPrev();
  });

  // Fullscreen
  const fsEl = $('viewerFs');
  $('vbFull').onclick = () => {
    if (!document.fullscreenElement) {
      (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
    } else document.exitFullscreen();
    // Resize the page-flip after fullscreen transition
    setTimeout(() => pageFlip.update(), 300);
  };
  document.addEventListener('fullscreenchange', () => setTimeout(() => pageFlip.update(), 300));

  // Resize handling
  window.addEventListener('resize', () => pageFlip.update());
})();
</script>
</body>
</html>
